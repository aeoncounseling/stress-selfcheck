<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>

<title>나의 스트레스 반응 알아보기 | 심리학에게 묻다</title>
<style>
:root{--bg:#f7f5f0;--white:#fff;--ink:#27323a;--sub:#5b686e;--line:#dedfdd;--teal:#286870;--pale:#e8f0ed;--pink:#f6ece5;--focus:#153d48;--shadow:0 8px 32px rgba(19,45,46,.065)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.65;word-break:keep-all}
main{max-width:830px;margin:0 auto;padding:26px 20px 70px}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #88bcc1;outline-offset:2px}h1{font-size:clamp(26px,4vw,37px);letter-spacing:-.05em;line-height:1.3;margin:10px 0 12px}h2{font-size:clamp(22px,3.5vw,28px);letter-spacing:-.05em;margin:0 0 10px}h3{font-size:18px;letter-spacing:-.03em;margin:24px 0 9px}p{margin:8px 0 15px}.muted{color:var(--sub)}.small{font-size:14px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.11em;color:var(--teal)}.card{background:var(--white);border:1px solid #e9e9e7;border-radius:20px;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow);margin:18px 0}.card.compact{padding:23px 25px}.heading-line{display:flex;align-items:center;gap:9px;margin-bottom:8px}.dot{width:10px;height:10px;border-radius:50%;background:var(--teal)}.callout{background:#eef2f0;border-left:3px solid var(--teal);padding:16px 18px;border-radius:0 12px 12px 0;font-size:15px;margin:20px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;align-items:center}.btn{background:var(--teal);border:1px solid var(--teal);border-radius:12px;color:#fff;padding:13px 23px;font-weight:800;min-height:50px}.btn:hover{background:#164b52}.btn.secondary{background:#fff;color:var(--teal);border-color:#9cb4b3}.btn.secondary:hover{background:#edf4f2}.btn.ghost{background:transparent;color:var(--sub);border-color:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.stepper{display:flex;gap:8px;margin:10px 0 24px}.stepper span{height:7px;background:#e1e5e3;flex:1;border-radius:20px}.stepper span.active{background:var(--teal)}.number{font-size:13px;color:var(--teal);font-weight:800}.qblock{padding:19px 0;border-top:1px solid #ebece9}.qblock:first-of-type{border-top:0}.qtext{font-size:17px;font-weight:650;margin:7px 0 13px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.choice{padding:12px 5px;border:1px solid #d6dfde;border-radius:10px;background:#fff;color:#49595e;min-height:50px;font-weight:750;font-size:15px}.choice:hover{background:#eef5f2}.choice.selected{background:var(--teal);color:white;border-color:var(--teal)}.feedback{color:#ab4c35;font-weight:650;font-size:14px;min-height:22px}.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:15px 0 8px}.legend div{border-radius:9px;background:#f1f4f2;padding:9px 5px;text-align:center;font-size:13px}.legend strong{display:block;font-size:18px}.results{display:grid;gap:18px}.resultrow{border-bottom:1px solid #eee;padding-bottom:13px}.resulthead{display:flex;justify-content:space-between;gap:15px;font-weight:750;margin-bottom:7px}.track{height:13px;background:#e6ece9;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--teal);border-radius:20px;transition:width .4s ease}.resultdesc{font-size:14px;color:var(--sub);margin-top:6px}.tag{display:inline-flex;background:var(--pale);color:#22525a;border-radius:8px;padding:4px 8px;margin:3px;font-size:14px;font-weight:650}.statnote{padding:15px;border-radius:12px;background:#f4f6f4}.fieldlabel{display:block;font-weight:750;margin:15px 0 6px}.field{width:100%;border:1px solid #c7d3d2;border-radius:11px;padding:13px 14px;background:white;color:var(--ink);min-height:50px}.field::placeholder{color:#9ba6aa}textarea.field{min-height:80px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.miniitem{border:1px solid #e0e5e2;border-radius:14px;padding:14px;margin-bottom:12px}.miniitem input{margin-bottom:8px}.itemname{font-size:14px;font-weight:750;margin-bottom:7px}.rating{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ratechoice{display:inline-flex;align-items:center;justify-content:center;border:1px solid #cfdad7;border-radius:9px;min-width:41px;min-height:41px;cursor:pointer}.ratechoice input{position:absolute;opacity:0;width:1px;height:1px}.ratechoice:has(input:checked){background:var(--teal);color:white;border-color:var(--teal);font-weight:900}.ratechoice:focus-within{outline:3px solid #88bcc1}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{border:1px solid #d1ddda;background:white;border-radius:999px;padding:8px 13px;font-size:15px;color:#395055;cursor:pointer}.chip.chosen{background:var(--teal);color:#fff;border-color:var(--teal)}.checklist{display:grid;gap:9px;margin-top:10px}.checkrow{display:flex;gap:12px;align-items:flex-start;border:1px solid #dde4e1;border-radius:11px;padding:11px 12px}.checkrow input{width:20px;height:20px;accent-color:var(--teal);margin:3px 0 0;flex:none}.notice{color:#4d636a;background:#f5f6f5;padding:14px;border-radius:12px;font-size:14px;margin-top:19px}.underlined{border-bottom:1px solid #d6dbd7;padding-bottom:8px;margin-bottom:10px}.finalitem{padding:9px 0;border-bottom:1px solid #ebece9;white-space:pre-wrap}.print-area{display:none}.footer{margin:30px auto;text-align:center;color:var(--sub);font-size:12px}#app{min-height:500px}@media(max-width:620px){main{padding:18px 12px 55px}.card{border-radius:16px;padding:22px 17px}.twocol{grid-template-columns:1fr}.choices{gap:5px}.choice{font-size:13px;padding:8px 0}.legend{gap:4px}.legend div{font-size:11px;padding:7px 2px}.legend strong{font-size:16px}.btn{flex:1;white-space:nowrap;padding:12px 10px}.actions{gap:8px}}@media print{body{background:#fff;color:#000;font-size:12pt}main{max-width:none;padding:0}#app,.footer,.screen-only{display:none!important}.print-area{display:block!important}.print-area h1{font-size:22pt}.print-area h2{margin:20px 0 7px;font-size:16pt}.print-area p{margin:5px 0}.printrow{display:flex;align-items:center;gap:15px;margin:7px 0}.printrow b{width:120px}.printbar{width:200px;height:9px;background:#ddd}.printbar i{display:block;height:100%;background:#444}.page-break{break-before:page}}
</style>
</head>
<body>
<main>
  <div class="eyebrow screen-only">심리학에게 묻다 · 수업 활동</div>
  <div id="app" aria-live="polite"></div>
  <section id="printArea" class="print-area"></section>
  <div class="footer screen-only">이 활동은 심리검사나 진단이 아닌 자기점검용 수업 자료입니다. 응답 내용은 서버로 전송되지 않습니다.</div>
</main>
<script>
'use strict';
const SECTIONS=[
  ["신체적 반응", ["목이나 어깨, 턱 등에 힘이 들어가고 근육이 긴장되었다.", "두통이나 몸의 통증, 뻐근함을 느꼈다.", "속이 더부룩하거나 소화가 잘되지 않았다.", "가슴이 두근거리거나 심장이 빨리 뛰는 느낌이 있었다.", "평소보다 쉽게 피곤해지거나 기운이 없었다.", "잠들기 어렵거나 자다가 자주 깼다.", "긴장할 때 손에 땀이 나거나 손발이 차가워졌다.", "평소보다 숨이 가빠지거나 호흡이 얕아졌다.", "갑자기 얼굴이 달아오르거나 몸에 열이 나는 듯했다.", "입이 마르거나 목이 꽉 막힌 듯한 느낌이 들었다."]],
  ["정서적 반응", ["별다른 이유 없이 불안하거나 초조했다.", "평소보다 쉽게 짜증이 나거나 화가 났다.", "사소한 일에도 마음이 상하거나 서운했다.", "마음이 답답하거나 무거운 느낌이 들었다.", "의욕이 떨어지거나 즐거움을 느끼기 어려웠다.", "평소보다 감정이 쉽게 흔들리거나 예민해졌다.", "해야 할 일을 감당하기 벅차다고 느꼈다.", "평소보다 쉽게 울컥하거나 눈물이 날 것 같았다.", "무엇부터 해야 할지 막막하게 느껴졌다.", "주변에 사람이 있어도 혼자인 것처럼 느껴졌다."]],
  ["인지적 반응", ["걱정되는 생각이 머릿속에서 반복되었다.", "해야 할 일에 집중하기 어려웠다.", "평소보다 깜빡하거나 실수가 잦아졌다.", "작은 문제도 실제보다 크게 느껴졌다.", "일이 잘못될 것 같은 생각이 자주 들었다.", "결정을 내리거나 생각을 정리하는 데 어려움이 있었다.", "쉬는 동안에도 해야 할 일이 계속 머릿속에 떠올랐다.", "이미 지나간 일을 반복해서 떠올리며 곱씹었다.", "다른 사람의 말이나 표정을 평소보다 부정적으로 받아들였다.", "평소라면 할 수 있는 일도 잘 해내지 못할 것 같았다."]],
  ["행동적 반응", ["해야 할 일을 미루거나 피했다.", "사람들과의 만남이나 대화를 피하고 싶었다.", "평소보다 말이나 행동이 급해졌다.", "식사량이나 간식 섭취량이 평소와 달라졌다.", "휴대전화나 TV 등을 보면서 시간을 보내는 일이 늘었다.", "스트레스를 받을 때 평소보다 충동적으로 말하거나 행동했다.", "피곤해도 잠자리에 드는 시간을 자꾸 미뤘다.", "이미 확인한 것을 다시 확인하는 일이 늘었다.", "평소 좋아하던 활동이나 취미생활을 줄였다.", "스트레스를 받을 때 평소보다 불필요한 일을 더 많이 하거나 바쁘게 움직였다."]]
];
const FEELINGS=["불안한", "초조한", "걱정되는", "긴장되는", "두려운", "화나는", "억울한", "원망스러운", "짜증나는", "답답한", "서운한", "속상한", "슬픈", "외로운", "울적한", "허탈한", "실망스러운", "후회되는", "위축되는", "기쁜", "반가운", "행복한", "즐거운", "흐뭇한", "뿌듯한", "만족스러운", "감사하는", "개운한", "이해받는", "평화로운"];
const STRATEGIES=["해결할 수 있는 방법을 찾아본다", "믿을 만한 사람에게 이야기하거나 도움을 청한다", "휴식·산책·취미 등으로 기분을 전환한다", "감정을 느끼지 않으려고 애쓰거나 생각을 밀어낸다", "일을 미루거나 상황을 피한다", "내가 무엇을 느끼는지 알아차리고 받아들이려고 한다"];
const scoreLabels=['전혀 없었다','가끔 있었다','자주 있었다','거의 매일 있었다'];
const descriptions=[
 '긴장, 피로, 수면, 소화 등 몸의 변화가 얼마나 자주 나타났는지 살펴봅니다. 이러한 증상에는 스트레스 외의 원인도 있을 수 있습니다.',
 '불안, 짜증, 서운함, 무기력처럼 감정이 어떻게 변했는지 돌아봅니다.',
 '반복되는 걱정, 집중의 어려움, 부정적인 예상 등 생각의 변화를 살펴봅니다.',
 '미루기, 회피, 평소와 달라진 생활 습관 등 행동의 변화를 살펴봅니다.'
];
const ITEMS_PER_SECTION=10;
const TOTAL_ITEMS=SECTIONS.length*ITEMS_PER_SECTION;
const MAX_SCORE=ITEMS_PER_SECTION*3;
const values=Array(TOTAL_ITEMS).fill(null);
const state={step:-1,spent:[{name:'',num:3},{name:'',num:3},{name:'',num:3}],gained:[{name:'',num:3},{name:'',num:3},{name:'',num:3}],hidden:'',balance:'',planWhen:'',planWhat:'',selectedFeelings:[],selectedStrategies:[],earliest:'',pattern:['','','','',''],usually:'',effectiveness:'',next:'',phase:'intro'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function scrollUp(){window.scrollTo({top:0,behavior:'instant'});}
function setView(html){$('app').innerHTML=html;scrollUp();}
function head(title,subtitle='',num=''){return `<div class="card"><div class="eyebrow">${esc(num)}</div><h1>${esc(title)}</h1>${subtitle?`<p class="muted">${subtitle}</p>`:''}</div>`;}
function steps(current){return `<div class="stepper" aria-label="진행 상황">${[0,1,2,3].map(i=>`<span class="${i<=current?'active':''}"></span>`).join('')}</div>`;}
function showIntro(){state.phase='intro';setView(`<div class="card"><div class="eyebrow">일상 스트레스 · 개인 자기점검</div><h1>나에게 나타나는<br/>스트레스 반응 알아보기</h1><p>스트레스 상황에서 나에게 어떤 변화가 나타나는지 살펴보는 활동입니다.</p><div class="callout"><strong>총 40문항 · 4개 영역</strong><br>신체 · 정서 · 인지 · 행동<br><span class="small">최근 2주 동안의 경험을 떠올려 답하세요.</span></div><h3>응답 방법</h3><div class="legend">${scoreLabels.map((s,i)=>`<div><strong>${i}점</strong>${s}</div>`).join('')}</div><div class="actions"><button class="btn" id="start">시작하기 →</button></div></div><div class="card compact"><h3 style="margin-top:0">활동 후에는</h3><p>① 네 영역별 결과 확인 &nbsp; ② 스트레스 반응 흐름 &nbsp; ③ 내 에너지 가계부 &nbsp; ④ 감정과 대처 돌아보기</p><p class="muted small">모든 내용은 이 기기에서만 계산되며, 이름·학번을 입력하거나 결과를 제출할 필요가 없습니다.</p></div>`);$('start').onclick=()=>showQuestions(0);}
function showQuestions(group){state.phase='questions';state.step=group;const offset=group*ITEMS_PER_SECTION;const body=SECTIONS[group][1].map((q,i)=>{const idx=offset+i;return `<div class="qblock"><div class="number">문항 ${idx+1} / ${TOTAL_ITEMS}</div><div class="qtext">${esc(q)}</div><div class="choices" role="group" aria-label="문항 ${idx+1} 답변">${scoreLabels.map((label,n)=>`<button class="choice ${values[idx]===n?'selected':''}" data-q="${idx}" data-val="${n}" aria-pressed="${values[idx]===n}">${n}점</button>`).join('')}</div></div>`}).join('');setView(`<div class="card"><div class="eyebrow">${group+1} / 4 영역</div><h2>${esc(SECTIONS[group][0])}</h2><p class="muted">최근 2주 동안의 경험을 기준으로 체크하세요.</p>${steps(group)}<div class="legend">${scoreLabels.map((s,i)=>`<div><strong>${i}점</strong>${s}</div>`).join('')}</div>${body}<div class="feedback" id="feedback"></div><div class="actions"><button class="btn secondary" id="prev">← 이전</button><button class="btn" id="next">${group===3?'결과 확인하기':'다음 영역 →'}</button></div></div>`);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=+b.dataset.q; values[q]=+b.dataset.val;document.querySelectorAll(`[data-q="${q}"]`).forEach(c=>{const selected=c===b;c.classList.toggle('selected',selected);c.setAttribute('aria-pressed',String(selected));});$('feedback').textContent='';});$('prev').onclick=()=>group===0?showIntro():showQuestions(group-1);$('next').onclick=()=>{if(values.slice(offset,offset+ITEMS_PER_SECTION).some(v=>v===null)){$('feedback').textContent='이 영역의 열 문항에 모두 답해 주세요.';return}group===3?showResults():showQuestions(group+1)};}
function totals(){return SECTIONS.map((_,g)=>values.slice(g*ITEMS_PER_SECTION,(g+1)*ITEMS_PER_SECTION).reduce((a,b)=>a+(b??0),0));}
function highlighted(){const max=Math.max(...totals());return totals().map((n,i)=>n===max?SECTIONS[i][0]:null).filter(Boolean);}
function highestItems(){return values.map((v,i)=>({v,i,text:SECTIONS[Math.floor(i/ITEMS_PER_SECTION)][1][i%ITEMS_PER_SECTION]})).filter(x=>x.v>=2).sort((a,b)=>b.v-a.v).slice(0,4);}
function showResults(){state.phase='results';const scores=totals();const cards=scores.map((v,i)=>`<div class="resultrow"><div class="resulthead"><span>${esc(SECTIONS[i][0])}</span><span>${v} / ${MAX_SCORE}점</span></div><div class="track"><div class="fill" style="width:${v/MAX_SCORE*100}%"></div></div><div class="resultdesc">${esc(descriptions[i])}</div></div>`).join('');const top=highestItems();setView(`<div class="card"><div class="eyebrow">나의 스트레스 반응 결과</div><h1>내가 체크한 반응은?</h1><p class="muted">네 영역은 각 10문항, 0~30점입니다. 점수는 응답 빈도를 합산한 참고값이에요.</p><div class="results">${cards}</div><div class="statnote" style="margin-top:20px"><strong>상대적으로 많이 체크한 영역:</strong><br>${esc(highlighted().join(' · '))}<br><span class="small muted">어느 영역이 높다고 특정 '스트레스 유형'으로 분류되는 것은 아닙니다.</span></div><h3>최근 자주 경험한 반응</h3>${top.length?top.map(x=>`<div class="underlined">${esc(x.text)} <span class="muted small">(${x.v}점)</span></div>`).join(''):'<p class="muted">2점 이상으로 응답한 문항은 없습니다.</p>'}<div class="notice">이 문항들은 수업용으로 구성한 자기점검표이며 표준화·타당화된 검사가 아닙니다. 높은 점수만으로 건강 상태나 PTSD를 판단할 수 없습니다.</div><div class="actions"><button class="btn secondary" id="back">← 응답 수정</button><button class="btn" id="energy">반응 흐름 살펴보기 →</button></div></div>`);$('back').onclick=()=>showQuestions(3);$('energy').onclick=()=>showPattern();}

const PATTERN_QUESTIONS=[
 ['1. 어떤 일이 있었나요?', '예: 해야 할 일이 몰렸는데 가족에게 부탁까지 받았다.'],
 ['2. 그때 가장 먼저 나타난 스트레스 신호는 무엇이었나요?', '예: 어깨에 힘이 들어가고 마음이 조급해졌다.'],
 ['3. 그 순간 머릿속에는 어떤 생각이 떠올랐나요?', '예: 왜 모든 일을 나 혼자 해야 하지?'],
 ['4. 그래서 나는 어떻게 행동했나요?', '예: 짜증을 내고 대화를 피했다.'],
 ['5. 그 행동 이후 상황이나 내 마음은 어떻게 달라졌나요?', '예: 당장은 조용해졌지만 서로 불편한 마음이 남았다.']
];
function showPattern(){
 state.phase='pattern';
 const fields=PATTERN_QUESTIONS.map((q,i)=>`<label class="fieldlabel" for="pattern-${i}">${esc(q[0])}</label><textarea class="field" id="pattern-${i}" data-pattern="${i}" placeholder="${esc(q[1])}">${esc(state.pattern[i])}</textarea>`).join('');
 setView(`<div class="card"><div class="eyebrow">자기이해 활동 · 스트레스 반응 흐름</div><h1>나의 스트레스 반응 흐름 살펴보기</h1><p>최근 일주일 동안 겪었던 <strong>비교적 가벼운 일상적 스트레스 상황 하나</strong>를 떠올려 보세요. 부담되는 경험을 굳이 떠올리거나 다른 사람에게 공개할 필요는 없습니다.</p><p class="muted small">앞서 체크한 반응을 참고하여 자신에게 맞는 내용을 적어 보세요. 모든 칸을 채울 필요는 없습니다.</p>${fields}<div class="actions"><button class="btn secondary" id="back">← 결과로</button><button class="btn" id="next">에너지 가계부로 →</button></div></div>`);
 document.querySelectorAll('[data-pattern]').forEach(el=>el.oninput=()=>state.pattern[+el.dataset.pattern]=el.value);
 $('back').onclick=showResults;$('next').onclick=showEnergy;
}
function energyColumns(which,title,sign){const arr=state[which];return `<section><h3>${title}</h3><p class="muted small">${which==='spent'?'나를 지치게 하는 일 (예: 수면 부족, 집안일, 걱정)':'나를 채우는 일 (예: 산책, 충분한 잠, 반려동물)'}</p>${arr.map((it,i)=>`<div class="miniitem"><label class="itemname" for="${which}-${i}">${i+1}. ${sign==='−'?'출금':'입금'} 항목</label><input class="field" id="${which}-${i}" data-t="name" data-which="${which}" data-i="${i}" value="${esc(it.name)}" placeholder="직접 적어 보세요"/><div class="itemname">체감 크기 (1~5)</div><div class="rating">${[1,2,3,4,5].map(n=>`<label class="ratechoice"><input type="radio" name="${which}-rating-${i}" data-t="num" data-which="${which}" data-i="${i}" value="${n}" ${it.num===n?'checked':''}/>${n}</label>`).join('')}</div></div>`).join('')}</section>`;}
function bindFields(){document.querySelectorAll('[data-t="name"]').forEach(el=>el.oninput=()=>state[el.dataset.which][+el.dataset.i].name=el.value);document.querySelectorAll('[data-t="num"]').forEach(el=>el.onchange=()=>state[el.dataset.which][+el.dataset.i].num=+el.value);document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>state[el.dataset.field]=el.value);}
function showEnergy(){state.phase='energy';setView(`<div class="card"><div class="eyebrow">자기돌봄 활동 1</div><h1>내 에너지 가계부</h1><p>지난 한 주를 떠올리며, 나를 지치게 한 일과 나를 채워 준 일을 적어 봅니다. 모든 칸을 채울 필요는 없습니다.</p><div class="twocol">${energyColumns('spent','출금 — 나를 빼가는 것','−')}${energyColumns('gained','입금 — 나를 채우는 것','+')}</div><div class="callout"><strong>체감 크기</strong>는 느낌대로 적으세요. 출금과 입금을 더해 객관적인 스트레스 점수를 구하는 활동은 아닙니다.</div><h3>현재 나의 에너지 잔고는?</h3><div class="checklist">${['흑자','겨우 본전','적자','파산 직전'].map(v=>`<label class="checkrow"><input type="radio" name="balance" value="${v}" ${state.balance===v?'checked':''}/><span>${v}</span></label>`).join('')}</div><label class="fieldlabel" for="hidden">가장 큰 숨은 출금은?</label><input id="hidden" class="field" data-field="hidden" placeholder="예: 밤에도 멈추지 않는 걱정" value="${esc(state.hidden)}"/><h3>이번 주 입금 예약 한 건</h3><div class="twocol"><div><label class="fieldlabel" for="planWhen">언제</label><input id="planWhen" class="field" data-field="planWhen" placeholder="예: 화요일 저녁" value="${esc(state.planWhen)}"/></div><div><label class="fieldlabel" for="planWhat">무엇을</label><input id="planWhat" class="field" data-field="planWhat" placeholder="예: 20분 걷기" value="${esc(state.planWhat)}"/></div></div><div class="actions"><button class="btn secondary" id="back">← 반응 흐름</button><button class="btn" id="next">감정·대처 돌아보기 →</button></div></div>`);bindFields();document.querySelectorAll('[name="balance"]').forEach(b=>b.onchange=()=>state.balance=b.value);$('back').onclick=showPattern;$('next').onclick=showCoping;}
function showCoping(){state.phase='coping';setView(`<div class="card"><div class="eyebrow">자기돌봄 활동 2</div><h1>내 감정과 대처 돌아보기</h1><p>최근 스트레스를 받았던 <strong>일상적인 상황</strong>을 떠올려 보세요. 힘들었던 외상 경험을 떠올리거나 공개할 필요는 없습니다.</p><h3>① 최근 한 주에 느낀 감정 고르기</h3><p class="muted small">해당되는 감정을 1~3개 선택할 수 있습니다. 꼭 불쾌한 감정일 필요는 없습니다.</p><div class="chips" id="feelings">${FEELINGS.map(f=>`<button class="chip ${state.selectedFeelings.includes(f)?'chosen':''}" data-feel="${esc(f)}" aria-pressed="${state.selectedFeelings.includes(f)}">${esc(f)}</button>`).join('')}</div><p id="feel-msg" class="feedback"></p><h3>② 나는 스트레스를 받으면 보통 어떻게 하나요?</h3><p class="muted small">해당하는 행동을 모두 골라 보세요. 대처에는 상황에 따라 서로 다른 장단점이 있습니다.</p><div class="checklist">${STRATEGIES.map((s,i)=>`<label class="checkrow"><input type="checkbox" data-strategy="${i}" ${state.selectedStrategies.includes(i)?'checked':''}/><span>${esc(s)}</span></label>`).join('')}</div><label class="fieldlabel" for="usually">가장 흔히 하는 행동 한 가지는?</label><input class="field" id="usually" data-field="usually" placeholder="위 선택지에서 골라도 됩니다" value="${esc(state.usually)}"/><h3>③ 그 행동이 실제로 도움이 되었나요?</h3><div class="checklist">${['도움이 되었다','잠깐은 편해졌지만 이후에는 별로 도움이 되지 않았다','오히려 스트레스가 커졌다','잘 모르겠다'].map(s=>`<label class="checkrow"><input type="radio" name="effectiveness" value="${esc(s)}" ${state.effectiveness===s?'checked':''}/><span>${esc(s)}</span></label>`).join('')}</div><label class="fieldlabel" for="nextCare">④ 다음에는 나를 위해 무엇을 해볼까요?</label><textarea class="field" id="nextCare" data-field="next" placeholder="예: 걱정이 반복되는 날에는 산책을 하며 잠시 생각을 정리한다.">${esc(state.next)}</textarea><div class="actions"><button class="btn secondary" id="back">← 에너지 가계부</button><button class="btn" id="finish">정리 결과 보기 →</button></div></div>`);document.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{const f=b.dataset.feel;const a=state.selectedFeelings; if(a.includes(f)){state.selectedFeelings=a.filter(x=>x!==f);}else if(a.length<3){a.push(f);}else{$('feel-msg').textContent='감정은 최대 3개까지 고를 수 있습니다.';return;}b.classList.toggle('chosen',state.selectedFeelings.includes(f));b.setAttribute('aria-pressed',String(state.selectedFeelings.includes(f)));$('feel-msg').textContent='';});document.querySelectorAll('[data-strategy]').forEach(b=>b.onchange=()=>{const i=+b.dataset.strategy;state.selectedStrategies=b.checked?[...new Set([...state.selectedStrategies,i])]:state.selectedStrategies.filter(x=>x!==i)});document.querySelectorAll('[name="effectiveness"]').forEach(b=>b.onchange=()=>state.effectiveness=b.value);bindFields();$('back').onclick=showEnergy;$('finish').onclick=showFinish;}
function printFields(){const scores=totals();const arr=(items)=>items.filter(x=>x.name.trim()).map(x=>`${esc(x.name)} (체감 ${x.num})`).join(' / ')||'—';const row=(k,v)=>`<div class="finalitem"><b>${esc(k)}</b><div>${esc(v||'—')}</div></div>`;return `<h1>나의 스트레스 반응 · 자기돌봄 기록</h1><p>심리학에게 묻다 / 수업용 자기점검 (비진단)</p><h2>영역별 결과</h2>${scores.map((s,i)=>`<div class="printrow"><b>${esc(SECTIONS[i][0])}</b><span>${s} / ${MAX_SCORE}점</span><span class="printbar"><i style="width:${s/MAX_SCORE*100}%"></i></span></div>`).join('')}<p>자주 경험한 반응: ${highestItems().map(x=>esc(x.text)).join(' / ')||'—'}</p><h2>나의 스트레스 반응 흐름</h2>${PATTERN_QUESTIONS.map((q,i)=>row(q[0],state.pattern[i])).join('')}<h2>내 에너지 가계부</h2><p><b>출금:</b> ${arr(state.spent)}</p><p><b>입금:</b> ${arr(state.gained)}</p>${row('현재 에너지 잔고',state.balance)}${row('가장 큰 숨은 출금',state.hidden)}${row('이번 주 입금 예약',`${state.planWhen} / ${state.planWhat}`)}<h2>감정과 대처</h2>${row('최근 느낀 감정',state.selectedFeelings.join(', '))}${row('평소 대처',state.selectedStrategies.map(i=>STRATEGIES[i]).join(' / '))}${row('가장 흔한 행동',state.usually)}${row('도움이 되었는가?',state.effectiveness)}${row('다음에 해볼 일',state.next)}<p style="margin-top:18px;font-size:10pt">이 자료는 표준화된 검사나 PTSD 진단 결과가 아닙니다.</p>`;}
function showFinish(){state.phase='finish';const scores=totals();const written=[state.hidden,state.planWhat,state.next].filter(Boolean).length;setView(`<div class="card"><div class="eyebrow">개별 활동 마무리</div><h1>오늘 나를 위해 확인한 것</h1><p>나에게 나타나는 스트레스 반응과 생활 속의 회복 자원을 살펴봤습니다.</p><h3>나의 영역별 점수</h3><div class="results">${scores.map((s,i)=>`<div class="resultrow"><div class="resulthead"><span>${esc(SECTIONS[i][0])}</span><span>${s} / ${MAX_SCORE}점</span></div><div class="track"><div class="fill" style="width:${s/MAX_SCORE*100}%"></div></div></div>`).join('')}</div><h3>이번 주 해볼 일</h3><div class="statnote">${state.planWhen||state.planWhat?`<p><b>에너지 가계부:</b> ${esc(`${state.planWhen} ${state.planWhat}`)}</p>`:''}${state.next?`<p><b>새로운 대처 시도:</b> ${esc(state.next)}</p>`:''}${!state.planWhat&&!state.next?'<p>지금 당장 작성하지 않아도 괜찮습니다. 필요할 때 자신의 반응을 다시 돌아보세요.</p>':''}</div><div class="callout">자신의 반응을 알아차리는 것이 이번 활동의 목적입니다. <strong>어떤 점수가 나왔다고 해서 잘못된 것은 아닙니다.</strong></div><div class="actions"><button class="btn secondary" id="back">← 이전 단계</button><button class="btn" id="print">결과 인쇄·PDF 저장</button><button class="btn ghost" id="reset">처음부터 다시 하기</button></div><div class="notice">결과 저장 버튼은 기기의 인쇄 화면을 엽니다. PDF로 저장하는 기능은 기기에 따라 다르며, 이 페이지에서 답변을 외부 서버로 보내지는 않습니다.</div></div>`);$('back').onclick=showCoping;$('print').onclick=()=>{$('printArea').innerHTML=printFields();window.print();};$('reset').onclick=()=>{if(confirm('응답과 작성한 내용을 모두 지우고 다시 시작할까요?'))location.reload();};}
showIntro();
</script>
</body>
